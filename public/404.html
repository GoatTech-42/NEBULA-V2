
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Lost in Space</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

    *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --bg: #060d18;
      --surface: rgba(255,255,255,.04);
      --border: rgba(255,255,255,.08);
      --text: #e2e8f0;
      --text-muted: rgba(226,232,240,.55);
      --accent: #4fc9ea;
      --accent-glow: rgba(79,201,234,.25);
      --danger: #f87171;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      position: relative;
    }

    /* Nebula background */
    .nebula {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .nebula .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .5;
      animation: drift 20s ease-in-out infinite alternate;
    }
    .nebula .blob:nth-child(1) {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(79,201,234,.3), transparent 70%);
      top: -20%; left: -15%;
    }
    .nebula .blob:nth-child(2) {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(150,100,255,.2), transparent 70%);
      bottom: -15%; right: -10%;
      animation-delay: -7s;
    }
    .nebula .blob:nth-child(3) {
      width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(248,113,113,.15), transparent 70%);
      top: 40%; left: 55%;
      animation-delay: -3s;
    }

    /* Stars */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 12% 25%, rgba(255,255,255,.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 28% 65%, rgba(255,255,255,.5) 0%, transparent 100%),
        radial-gradient(2px 2px at 48% 15%, rgba(255,255,255,.55) 0%, transparent 100%),
        radial-gradient(1px 1px at 65% 42%, rgba(255,255,255,.35) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 78% 72%, rgba(255,255,255,.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 88% 18%, rgba(255,255,255,.4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 35% 88%, rgba(255,255,255,.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 55%, rgba(255,255,255,.35) 0%, transparent 100%);
    }

    /* Content */
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 480px;
      padding: 2rem;
      animation: fadeUp .7s cubic-bezier(.16,1,.3,1);
    }

    /* Floating astronaut */
    .astro {
      width: 120px;
      height: 120px;
      margin: 0 auto 2rem;
      position: relative;
      animation: float 5s ease-in-out infinite;
    }
    .astro svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 20px var(--accent-glow));
    }

    .code {
      font-size: 7rem;
      font-weight: 900;
      letter-spacing: -.06em;
      line-height: 1;
      margin-bottom: .5rem;
      background: linear-gradient(135deg, var(--text) 0%, var(--accent) 50%, var(--danger) 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 4s ease-in-out infinite;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: .65rem;
      letter-spacing: -.02em;
    }

    p {
      font-size: .88rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 2rem;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
    }

    .actions {
      display: flex;
      gap: .75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .72rem 1.5rem;
      border-radius: 10px;
      font-size: .82rem;
      font-weight: 700;
      text-decoration: none;
      transition: all .22s ease;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: .3px;
    }
    .btn-primary {
      background: var(--accent);
      color: #020d1a;
      border: none;
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px var(--accent-glow);
    }
    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1.5px solid var(--border);
    }
    .btn-ghost:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .footer-tag {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: .52rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: .4;
      z-index: 1;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px) }
      to { opacity: 1; transform: translateY(0) }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg) }
      25% { transform: translateY(-12px) rotate(2deg) }
      75% { transform: translateY(8px) rotate(-2deg) }
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1) }
      to { transform: translate(30px, -20px) scale(1.08) }
    }
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50% }
      50% { background-position: 100% 50% }
    }

    @media (max-width: 480px) {
      .code { font-size: 5rem; }
      h1 { font-size: 1.2rem; }
      p { font-size: .82rem; }
      .astro { width: 90px; height: 90px; }
    }
  </style>
</head>
<body>
  <div class="nebula">
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
  </div>
  <div class="stars"></div>

  <div class="content">
    <div class="astro">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Helmet -->
        <circle cx="50" cy="38" r="22" stroke="#4fc9ea" stroke-width="2.5" fill="rgba(79,201,234,.08)"/>
        <circle cx="50" cy="38" r="16" stroke="rgba(255,255,255,.2)" stroke-width="1.5" fill="rgba(255,255,255,.03)"/>
        <!-- Visor reflection -->
        <ellipse cx="45" cy="34" rx="6" ry="4" fill="rgba(79,201,234,.2)"/>
        <!-- Body -->
        <rect x="36" y="58" width="28" height="24" rx="8" stroke="#4fc9ea" stroke-width="2" fill="rgba(79,201,234,.06)"/>
        <!-- Backpack -->
        <rect x="30" y="62" width="8" height="16" rx="3" stroke="rgba(255,255,255,.2)" stroke-width="1.5" fill="rgba(255,255,255,.03)"/>
        <!-- Arms -->
        <line x1="36" y1="65" x2="22" y2="75" stroke="rgba(255,255,255,.2)" stroke-width="2" stroke-linecap="round"/>
        <line x1="64" y1="65" x2="80" y2="58" stroke="rgba(255,255,255,.2)" stroke-width="2" stroke-linecap="round"/>
        <!-- Legs -->
        <line x1="42" y1="82" x2="38" y2="96" stroke="rgba(255,255,255,.2)" stroke-width="2" stroke-linecap="round"/>
        <line x1="58" y1="82" x2="62" y2="96" stroke="rgba(255,255,255,.2)" stroke-width="2" stroke-linecap="round"/>
        <!-- Tether -->
        <path d="M80 58 C88 52, 92 46, 88 38" stroke="rgba(79,201,234,.25)" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
      </svg>
    </div>
    <div class="code">404</div>
    <h1>Lost in the Nebula</h1>
    <p>This page has drifted into the void. The coordinates you entered don't match any known location in our system.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Return Home
      </a>
      <a href="javascript:history.back()" class="btn btn-ghost">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Go Back
      </a>
    </div>
  </div>

  <div class="footer-tag">nebula v2 &mdash; beyond the stars</div>
</body>
</html>
